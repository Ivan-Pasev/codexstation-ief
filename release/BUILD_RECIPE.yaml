schema_version: CS-IEF-10
release_id: codexstation-omega-portable
release_version: 0.1.0-rc1
spec_root: CS-IEF-10
omega_version: 0.2.0
source:
  repository: Ivan-Pasev/codexstation-ief
  ref_policy: exact-commit-required-at-build
inputs:
  omega_manifest: distributions/OMEGA_MANIFEST.yaml
  surface_profile: surfaces/portable.yaml
  source_manifest_root: sources/
  include:
    - README.md
    - ARCHITECTURE.md
    - SECURITY.md
    - GOVERNANCE.md
    - llms.txt
    - specs/
    - schemas/
    - distributions/
    - surfaces/portable.yaml
    - sources/
    - reference/portable_runtime.py
  exclude:
    - private-lab
    - secrets
    - credentials
normalization:
  file_order: lexical
  line_endings: LF
  unicode: NFC
  archive_timestamp: fixed
  uid_gid: zero
  absolute_paths: forbidden
  hostname_in_semantic_digest: false
  build_time_in_semantic_digest: false
packaging:
  semantic_format: directory-manifest
  optional_archives:
    - zip
    - tar
required_modes:
  - OMEGA_KNOWLEDGE_ONLY
execution_provider_required: false
signing:
  policy: explicit-state
  rc1_default_state: UNSIGNED
qualification:
  minimum_release_record: at-least-one-platform-record
  execution_mode_required: false
