name: attest-rc2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rebuild exact RC2 subject
        run: python release/build_portable_rc2.py
      - name: Verify exact frozen RC2 archive digest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="4110edafaa4b8bc860f359e9532634415164df86a6c26fd439608179bae08cf2"
          ARCHIVE=$(find . -type f -name '*0.1.0-rc2*.zip' -o -name '*rc2*.zip' | head -n 1)
          test -n "$ARCHIVE"
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
        id: subject
      - name: Attest frozen RC2 archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.subject.outputs.archive }}
